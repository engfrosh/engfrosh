{% extends "base_user.html" %}
{% load static %}
{% block page_title %}EngFrosh FAQ{% endblock page_title %}
{% block js_functions %}
<link rel='stylesheet' type='text/css' href="{% static 'jquery-ui/jquery-ui.min.css' %}" />
<script type='text/javascript' src="{% static 'jquery/dist/jquery.js' %}"></script>
<script type='text/javascript' src="{% static 'moment.js' %}"></script>
<script type='text/javascript' src="{% static 'jquery-ui/jquery-ui.min.js' %}"></script>
<script type='text/javascript' src="{% static 'fullcalendar.js' %}"></script>
{% endblock js_functions %}
{% block active %}
<a style="color: #FFFFFF;" class="bg-main dark:bg-main-night rounded p-2 flex-none max-w-fit max-h-fit text-sm mr-2"
           href="{% url 'view_faq' id=0 %}">Back</a>
    <style>
        table, th, td {
            border: 1px solid black;
            border-collapse: collapse;
        }
        table {
            margin-left: auto;
            margin-right: auto;
        }
        h1 {
            font-size: 32px;
        }
        a {
            color: lightblue;
        }
        img {
            margin-left: auto;
            margin-right: auto;
        }
        .bg-background {
            padding: 15px;
            overflow: scroll;
        }
               
        .faq-content {
            text-align: left;
        }

        .faq-content p {
            text-indent: 2em;
        }   

       .faq-content h1 {
            text-align: center;
            text-indent: 0;
       }
    </style>

    <div style="color: #FFFFFF; margin-bottom: 80px;" class="flex flex-col space-y-3 mx-auto container w-50% m-5">
           <div class="bg-background p-2 shadow faq-content">
                   <h1>{{ page.title }}</h1>
                   {{ page.html_body|safe }}
           </div>

</div>
{% endblock active %}
