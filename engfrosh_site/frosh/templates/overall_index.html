{% extends 'base_generic.html' %}
{% load static %}
{% block page_title %}
    EngFrosh
{% endblock page_title %}
{% block body %}
    <img src="{{ logo_url }}" class="m-auto" style="margin-top:10px; height:56vmin; width:75vmin;" alt="EngFrosh Logo">
    <div class="h-full text-center" style="margin:10px; margin-bottom:120px; font-size:3rem; color: #FFFFFF;">
        <div class="rounded-lg text-4xl p-4 mx-auto w-fit" style="background-color: #003c43;"><b id="timer" >Countdown</b></div>
        <div class="mx-auto w-1/2" style="display: grid; place-content: center; padding: 20px;"></div>
            <a href="{% url 'user_home' %}"
                class="bg-main dark:bg-main-night rounded-lg text-4xl p-4 mx-auto text-white" style="white-space: nowrap;">Enter the Multiverse</a>
        </div>
        <div>
            <a href="{% url 'inclusivity_public' %}"
                class="bg-main dark:bg-main-night rounded-lg text-2xl p-4 mx-auto text-white">Resources</a>
        </div>
        <div class="flex flex-col flex-wrap justify-center space-y-3 mx-auto container text-white text-center max-w-fit">
        {% for a in announcements %}
            <div class="m-8 bg-accent text-white width-50 rounded-lg" style="box-sizing: border-box; padding: 20px; font-size: 2rem;">
                <h2>{{ a.title }}</h2>
                <br>
                <p>{{ a.body}}</p>
            </div>
        {% endfor %}
        </div>
    </div>
    <script> <!-- Countdown timer until opening ceremonies -->
        var countDownDate = new Date("{{ countdown_date }}").getTime();
        function setCountdown(){
            var now = new Date().getTime();
            var distance = countDownDate - now;
            var days = Math.floor(distance / (1000 * 60 * 60 * 24));
            var hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            var seconds = Math.floor((distance % (1000 * 60)) / 1000);
            document.getElementById("timer").innerHTML = days + "D " + hours + "H " + minutes + "M " + seconds + "S ";
            if (distance < 0) {
                clearInterval(x);
                document.getElementById("timer").innerHTML = "";
            }
        }
        setCountdown();
        var x = setInterval(setCountdown, 1000);
    </script>
{% endblock body %}
